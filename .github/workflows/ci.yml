name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: |
          pnpm --filter @rasko/app test
          pnpm --filter @rasko/ui test

      - name: Formatting
        run: pnpm format:check

      - name: Frontend build
        run: pnpm --filter @rasko/app build:vite

  rust:
    name: Rust shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux build needs these even for `cargo check`: the webkit2gtk
      # crate probes for them in its build script.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri

      - name: cargo check
        working-directory: apps/app/src-tauri
        run: cargo check --locked

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on purpose while content/site.ts has no confirmed WhatsApp number
      # — the page's only call to action. See CLAUDE.md.
      - name: Build static site
        run: pnpm --filter @rasko/website build
