[package]
name = "rss-management-system"
version = "0.1.12"
description = "RSS Management System for Rasko Sweet Scent"
authors = ["Rasko Sweet Scent"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The mobile targets link the app as a library; the desktop binary calls into it.
name = "rss_management_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Local SQLite is the primary store on every device (PRD NFR-S1).
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop auto-update (PRD §7). Android does an in-app version check against the
# manifest instead, so the updater plugin is not built for mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Restarts the app once an update is installed.
tauri-plugin-process = "2"

# Printing and saving PDFs from WKWebView (src/pdf.rs). The same versions
# wry already builds, so nothing new is downloaded or compiled twice.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSView", "NSApplication"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
